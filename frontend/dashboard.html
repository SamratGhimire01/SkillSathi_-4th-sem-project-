<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SkillSathi</title>
    <!-- Modern Font: DM Sans -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Updated CSS -->
    <link rel="stylesheet" href="css/dashboard-modern.css">
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <!-- SIDEBAR -->
  
<aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo-icon"><i data-feather="award"></i></div>
            <span class="logo-text">SkillSathi</span>
        </div>

<!-- You MUST apply this same clean HTML fix to ALL your sidebar files: -->
<!-- admin_dashboard.html, workers.html, certificates.html, settings.html, help.html -->

        
        
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="sidebar-link active"><i data-feather="grid"></i> Dashboard</a>
            <a href="workers.html" class="sidebar-link"><i data-feather="users"></i> Workers</a>
            <a href="certificates.html" class="sidebar-link"><i data-feather="file-text"></i> Certificates</a>
            <a href="audit_logs.html" class="sidebar-link"><i data-feather="activity"></i> Audit Log</a>
            <a href="settings.html" class="sidebar-link"><i data-feather="settings"></i> Settings</a>
        </nav>

        <div class="sidebar-footer">
            <a href="#" class="sidebar-link logout" onclick="confirmLogout(event)">
    <i data-feather="log-out"></i> Logout
</a>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="main-wrapper">
        
        <!-- HEADER -->
        <header class="dashboard-header">
            <div class="header-left">
                <p>Welcome back,</p>
                <h1 id="welcomeMessage">Loading...</h1>
            </div>
            
            <div class="header-right">
                
                <div class="user-profile">
                    <div class="user-avatar" id="userInitial">U</div>
                    <span style="font-weight:700; font-size:0.9rem;" id="userName">User</span>
                </div>
            </div>
        </header>

        <!-- STATS ROW -->
        <section class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon icon-blue"><i data-feather="users"></i></div>
                <div class="stat-info">
                    <p>Total Workers</p>
                    <span class="stat-value" id="totalWorkers">0</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon icon-green"><i data-feather="check-circle"></i></div>
                <div class="stat-info">
                    <p>Certificates Issued</p>
                    <span class="stat-value" id="certsIssued">0</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon icon-orange"><i data-feather="clock"></i></div>
                <div class="stat-info">
                    <p>Pending Actions</p>
                    <span class="stat-value" id="pendingActions">0</span>
                </div>
            </div>
        </section>

        <!-- MAIN GRID (Chart + Approvals) -->
        <section class="dashboard-grid">
            
            <!-- CHART CARD -->
            <div class="card">
                <div class="card-header">
                    <h3>Certificate Analytics</h3>
                    <button class="btn-icon"><i data-feather="bar-chart-2"></i></button>
                </div>
                <div style="height: 300px; width: 100%;">
                    <canvas id="issuanceChart"></canvas>
                </div>
            </div>

            <!-- RIGHT COLUMN (Approvals & Activity) -->
            <div style="display: flex; flex-direction: column; gap: 30px;">
                
                <!-- PENDING APPROVALS -->
                <div class="card">
                    <div class="card-header">
                        <h3>Pending Approvals</h3>
                        
                    </div>
                    
                    <div class="table-container" style="max-height: 200px; overflow-y: auto;">
                        <table class="data-table" style="width:100%;">
                            <thead>
                                <tr style="color:var(--text-gray); font-size:0.85rem;">
                                    <th><input type="checkbox" id="selectAll"></th>
                                    <th>Details</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="approvalTableBody">
                                <!-- JS Injects Rows Here -->
                            </tbody>
                        </table>
                    </div>
                    <div style="margin-top: 15px; text-align: center;">
                        <button id="approveSelectedBtn" class="btn-primary" style="width:100%;">Approve Selected</button>
                    </div>
                </div>

                <!-- RECENT ACTIVITY -->
                <div class="card">
                    <div class="card-header">
                        <h3>Recent Activity</h3>
                    </div>
                    <div id="activityFeed" class="activity-feed">
                        <!-- JS Injects Activity Here -->
                    </div>
                </div>

            </div>
        </section>

    </div>

    <!-- Scripts -->
    <script>feather.replace()</script>
    <script src="js/dashboard.js"></script>
</body>
</html>
