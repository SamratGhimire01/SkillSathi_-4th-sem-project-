<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Audit Log - SkillSathi</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/dashboard-modern.css">
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo-icon"><i data-feather="award"></i></div>
            <span class="logo-text">SkillSathi</span>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="sidebar-link"><i data-feather="grid"></i> Dashboard</a>
            <a href="workers.html" class="sidebar-link"><i data-feather="users"></i> Workers</a>
            <a href="certificates.html" class="sidebar-link"><i data-feather="file-text"></i> Certificates</a>
            <a href="audit_logs.html" class="sidebar-link active"><i data-feather="activity"></i> Audit Log</a>
            <a href="settings.html" class="sidebar-link"><i data-feather="settings"></i> Settings</a>
        </nav>
        <div class="sidebar-footer"><a href="#" id="logoutButton" class="sidebar-link logout"><i data-feather="log-out"></i> Logout</a></div>
    </aside>

    <div class="main-wrapper">
        <header class="dashboard-header">
            <div class="header-left">
                <p>System Security</p>
                <h1>Audit Logs</h1>
            </div>
            <div class="header-right">
                <!-- Notification Bell -->
<div style="position:relative; margin-right:16px;">
    <button id="notifBell" onclick="toggleNotifPanel()" style="background:none; border:none; cursor:pointer; position:relative; padding:8px;">
        <i data-feather="bell" style="color:#2B3674; width:22px; height:22px;"></i>
        <span id="notifBadge" style="display:none; position:absolute; top:4px; right:4px; background:#EF4444; color:white; border-radius:50%; width:18px; height:18px; font-size:0.7rem; font-weight:700; display:flex; align-items:center; justify-content:center;">0</span>
    </button>

    <!-- Notification Panel -->
    <div id="notifPanel" style="display:none; position:absolute; right:0; top:50px; width:360px; background:white; border-radius:16px; box-shadow:0 10px 40px rgba(0,0,0,0.15); z-index:999; overflow:hidden;">
        <div style="padding:16px 20px; border-bottom:1px solid #F3F4F6; display:flex; justify-content:space-between; align-items:center;">
            <h3 style="font-size:1rem; color:#2B3674; margin:0;">Notifications</h3>
            <button onclick="markAllRead()" style="background:none; border:none; color:#3B82F6; cursor:pointer; font-size:0.85rem;">Mark all read</button>
        </div>
        <div id="notifList" style="max-height:400px; overflow-y:auto; padding:8px 0;">
            <p style="text-align:center; color:#9CA3AF; padding:20px;">Loading...</p>
        </div>
    </div>
</div>
                <div class="user-profile">
                    <div class="user-avatar" id="userInitial">U</div>
                    <span style="font-weight:700; font-size:0.9rem;" id="userName">Loading...</span>
                </div>
            </div>
        </header>

        <div class="card">
            <div class="card-header">
                <h3>Activity History</h3>
                <div class="filter-container">
                    <!-- NEW FILTER DROPDOWN -->
                    <select id="logFilterSelect" class="filter-select">
                        <option value="all">All Events</option>
                        <option value="login">Logins</option>
                        <option value="issue">Certificates Issued</option>
                        <option value="delete">Deleted Items</option>
                        <option value="approve">Approvals</option>
                        <option value="import">Bulk Imports</option>
                    </select>
                    <input type="text" id="logSearchInput" class="search-box" placeholder="Search staff name, details...">
                </div>
            </div>
            
            <div class="table-container">
                <table class="data-table" style="width:100%;">
                    <thead>
                        <tr style="color:var(--text-gray); font-size:0.85rem;">
                            <th>Date & Time</th>
                            <th>Event Type</th>
                            <th>Actor</th>
                            <th>Details</th>
                        </tr>
                    </thead>
                    <tbody id="auditLogTableBody">
                        <tr><td colspan="4" style="text-align:center; padding:1rem;">Loading logs...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div id="logPagination"></div>
    </div>

    <script>feather.replace()</script>
    <script src="js/audit_logs.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
