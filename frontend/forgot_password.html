<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password - SkillSathi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/auth-sliding.css">
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <style>
        body { background: #e0e5ec; }
        .container { width: 500px; height: auto; min-height: 550px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; border-radius: 20px; background: white; box-shadow: 0 20px 40px rgba(0,0,0,0.1); margin: 50px auto; }
        .form-container { position: relative; width: 100%; height: auto; transition: none; }
        form { padding: 0; width: 100%; }
        
        .step-container { display: none; width: 100%; animation: fadeIn 0.5s; }
        .step-container.active { display: block; }
        
        @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
        
        .icon-circle { width: 80px; height: 80px; background: #eff6ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px auto; color: #3A86FF; }
        
        .input-label {
            display: block;
            text-align: left;
            font-size: 0.85rem;
            font-weight: 600;
            color: #4B5563;
            margin-bottom: 6px;
            margin-top: 15px;
        }

        .password-wrapper {
            position: relative;
            width: 100%;
        }
        .password-wrapper input {
            width: 100%;
            padding-right: 45px;
        }
        .eye-btn {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #9CA3AF;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }
        .eye-btn:hover {
            color: #3A86FF;
        }
        .eye-btn svg {
            width: 18px;
            height: 18px;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
        }
        
        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }
        
        .alert-success {
            background: #d1fae5;
            color: #065f46;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        
        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- STEP 1: REQUEST EMAIL -->
    <div id="step1" class="step-container active">
        <form id="requestForm">
            <div class="icon-circle"><i data-feather="key" style="width:40px; height:40px;"></i></div>
            <h1 style="color: #333; margin-bottom: 10px;">Forgot Password?</h1>
            <p style="text-align:center; color:#666;">Enter your registered email address and we'll send you a 6-digit reset code.</p>
            
            <div id="alert1" class="alert-error" style="display:none;"></div>

            <label class="input-label">Email Address</label>
            <input type="email" id="emailInput" placeholder="Enter your email" required />
            
            <button type="submit" style="background-color: #3A86FF; color: white; width:100%; margin-top: 20px;">Send Reset Code</button>
            <a href="login.html" style="margin-top:20px; display:block; text-align:center; color:#3A86FF;">Back to Login</a>
        </form>
    </div>

    <!-- STEP 2: ENTER NEW PASSWORD -->
    <div id="step2" class="step-container">
        <form id="resetForm">
            <div class="icon-circle" style="background:#ecfdf5; color:#10B981;"><i data-feather="lock" style="width:40px; height:40px;"></i></div>
            <h1 style="color: #333; margin-bottom: 10px;">Reset Password</h1>
            <p style="text-align:center; color:#666;">Enter the 6-digit code sent to your email and create a new password.</p>

            <div id="alert2" class="alert-error" style="display:none;"></div>

            <label class="input-label">6-Digit Reset Code</label>
            <input type="text" id="tokenInput" placeholder="Enter 6-digit code" required maxlength="6" style="text-align:center; font-size:20px; letter-spacing:5px;" />
            
            <label class="input-label">New Password</label>
            <div class="password-wrapper">
                <input type="password" id="newPass" placeholder="Enter new password" required autocomplete="new-password" />
                <span class="eye-btn" onclick="togglePassword('newPass', this)">
                    <i data-feather="eye"></i>
                </span>
            </div>
            
            <label class="input-label">Confirm Password</label>
            <div class="password-wrapper">
                <input type="password" id="confirmPass" placeholder="Confirm new password" required autocomplete="new-password" />
                <span class="eye-btn" onclick="togglePassword('confirmPass', this)">
                    <i data-feather="eye"></i>
                </span>
            </div>
            
            <button type="submit" style="background-color: #10B981; color: white; width:100%; margin-top: 20px;">Update Password</button>
        </form>
    </div>

</div>

<script>
    feather.replace();
    const API_BASE_URL = "http://127.0.0.1:8000";

    function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
            input.type = "text";
            btn.style.color = "#3A86FF";
        } else {
            input.type = "password";
            btn.style.color = "#9CA3AF";
        }
    }

    function showAlert(alertId, message, isError = true) {
        const alertBox = document.getElementById(alertId);
        alertBox.className = isError ? 'alert-error' : 'alert-success';
        alertBox.innerHTML = message;
        alertBox.style.display = 'block';
        setTimeout(() => {
            alertBox.style.display = 'none';
        }, 5000);
    }

    // Step 1: Send Email
    document.getElementById('requestForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        const email = document.getElementById('emailInput').value;

        btn.innerText = "Sending..."; 
        btn.disabled = true;

        try {
            const res = await fetch(`${API_BASE_URL}/auth/forgot-password`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email: email })
            });
            const data = await res.json();

            if(res.ok) {
                showAlert('alert1', '✅ Reset code sent! Please check your email.', false);
                
                setTimeout(() => {
                    document.getElementById('step1').classList.remove('active');
                    document.getElementById('step2').classList.add('active');
                    document.getElementById('tokenInput').value = "";
                    document.getElementById('newPass').value = "";
                    document.getElementById('confirmPass').value = "";
                }, 2000);
            } else {
                showAlert('alert1', data.detail || 'Request failed', true);
                btn.innerText = "Send Reset Code";
                btn.disabled = false;
            }
        } catch(err) {
            showAlert('alert1', 'Network error. Please try again.', true);
            btn.innerText = "Send Reset Code";
            btn.disabled = false;
        }
    });

    // Step 2: Reset Password
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        
        const token = document.getElementById('tokenInput').value;
        const newPass = document.getElementById('newPass').value;
        const confirmPass = document.getElementById('confirmPass').value;

        if (!token || token.length !== 6) {
            showAlert('alert2', 'Please enter the 6-digit code', true);
            return;
        }

        if(newPass !== confirmPass) {
            showAlert('alert2', 'Passwords do not match', true);
            return;
        }

        if(newPass.length < 6) {
            showAlert('alert2', 'Password must be at least 6 characters', true);
            return;
        }

        btn.innerText = "Updating..."; 
        btn.disabled = true;

        try {
            const res = await fetch(`${API_BASE_URL}/auth/reset-password`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ token: token, new_password: newPass })
            });
            const data = await res.json();

            if(res.ok) {
                showAlert('alert2', '✅ Password changed successfully! Redirecting to login...', false);
                setTimeout(() => {
                    window.location.href = "login.html";
                }, 2000);
            } else {
                showAlert('alert2', data.detail || 'Reset failed', true);
                btn.innerText = "Update Password";
                btn.disabled = false;
            }
        } catch(err) {
            showAlert('alert2', 'Network error. Please try again.', true);
            btn.innerText = "Update Password";
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
