<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Certificates - SkillSathi</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/dashboard-modern.css">
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo-icon"><i data-feather="award"></i></div>
            <span class="logo-text">SkillSathi</span>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="sidebar-link"><i data-feather="grid"></i> Dashboard</a>
            <a href="workers.html" class="sidebar-link"><i data-feather="users"></i> Workers</a>
            <a href="certificates.html" class="sidebar-link active"><i data-feather="file-text"></i> Certificates</a>
            <a href="audit_logs.html" class="sidebar-link"><i data-feather="activity"></i> Audit Log</a>
            <a href="settings.html" class="sidebar-link"><i data-feather="settings"></i> Settings</a>
        </nav>
        <div class="sidebar-footer"><a href="#" id="logoutButton" class="sidebar-link logout"><i data-feather="log-out"></i> Logout</a></div>
    </aside>

    <div class="main-wrapper">
        <header class="dashboard-header">
            <div class="header-left">
                <p>Credential Management</p>
                <h1>Issued Certificates</h1>
            </div>
            <div class="header-right">
                <div class="user-profile">
                    <div class="user-avatar" id="userInitial">U</div>
                    <span style="font-weight:700; font-size:0.9rem;" id="userName">Loading...</span>
                </div>
            </div>
        </header>

        <div class="card">
            <div class="card-header">
                <h3>Certificate History</h3>
                <div class="filter-container">
                    <!-- STATUS FILTER -->
                    <select id="statusFilter" class="filter-select">
                        <option value="all">All Status</option>
                        <option value="active">Active</option>
                        <option value="pending">Pending</option>
                        <option value="revoked">Revoked</option>
                    </select>
                    
                    <!-- COURSE FILTER (Populated by JS) -->
                    <select id="courseFilter" class="filter-select">
                        <option value="all">All Courses</option>
                    </select>

                    <input type="text" id="certSearchInput" placeholder="Search name, ID..." class="search-box">
                    <button id="issueCertBtn" class="btn-primary"><i data-feather="plus"></i> Issue New</button>
                </div>
            </div>

            <div id="certificateList" class="cert-list">
                <p style="text-align: center; padding: 2rem; color: #A3AED0;">Loading certificates...</p>
            </div>
        </div>
    </div>

    <!-- Modals (Issue, Delete, QR) - Keep existing code -->
    <div id="issueCertModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <header class="modal-header"><h2>Issue a New Certificate</h2><button id="closeModalBtn" class="modal-close-btn">&times;</button></header>
            <div class="modal-body">
                <form id="issueCertForm" class="form">
                    <div class="form-group"><label class="form-label">Photo</label><input type="file" id="recipientPhoto" class="form-control" accept="image/*"></div>
                    <div class="form-group"><label class="form-label">Full Name</label><input type="text" id="recipientName" class="form-control" required></div>
                    <div class="form-group"><label class="form-label">Email</label><input type="email" id="recipientEmail" class="form-control" required></div>
                    <div class="form-group"><label class="form-label">Course Title</label><input type="text" id="courseTitle" class="form-control" required></div>
                    <div class="form-group">
    <label class="form-label">Course Duration (e.g. 4 Weeks)</label>
    <input type="text" id="courseDuration" class="form-control" placeholder="e.g. 4 Weeks (40+ Training Hours)">
</div>
                    <div class="form-group"><label class="form-label">Completion Date</label><input type="date" id="completionDate" class="form-control" required></div>
                    <div class="modal-footer"><button type="submit" class="btn-primary" style="width:100%">Issue Certificate</button></div>
                </form>
            </div>
        </div>
    </div>

    <div id="deleteCertModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <header class="modal-header"><h2 style="color:red">Delete Certificate</h2><button id="closeDeleteModal" class="modal-close-btn">&times;</button></header>
            <div class="modal-body">
                <p>Type the Recipient Name <strong><span id="deleteTargetName"></span></strong> to confirm.</p>
                <input type="text" id="confirmDeleteName" class="form-control" placeholder="Type name here...">
                <input type="hidden" id="deleteTargetId">
                <button id="confirmDeleteBtn" class="btn-primary" style="width:100%; margin-top:10px; background:#EF4444;">Delete</button>
            </div>
        </div>
    </div>

    <div id="qrModal" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="text-align: center;">
            <header class="modal-header"><h2>Certificate QR</h2><button id="closeQrModal" class="modal-close-btn">&times;</button></header>
            <div class="modal-body">
                <img id="qrImageDisplay" src="" style="width:150px; margin-bottom:10px;">
                <input type="text" id="qrLinkInput" class="form-control" readonly>
                <button class="btn-primary" onclick="copyQrLink()" style="width:100%; margin-top:10px;">Copy Link</button>
            </div>
        </div>
    </div>

    <script>feather.replace()</script>
    <script src="js/certificates.js"></script>
</body>
</html>
