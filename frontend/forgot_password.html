<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password - SkillSathi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Reusing existing CSS -->
    <link rel="stylesheet" href="css/auth-sliding.css">
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <style>
        /* Specific overrides for this simple centered page */
        body { background: #e0e5ec; }
        .container { width: 500px; height: auto; min-height: 550px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; border-radius: 20px; }
        .form-container { position: relative; width: 100%; height: auto; transition: none; }
        form { padding: 0; width: 100%; }
        
        .step-container { display: none; width: 100%; animation: fadeIn 0.5s; }
        .step-container.active { display: block; }
        
        @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
        
        .icon-circle { width: 80px; height: 80px; background: #eff6ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px auto; color: #3A86FF; }
        
        /* Label Styling */
        .input-label {
            display: block;
            text-align: left;
            font-size: 0.85rem;
            font-weight: 600;
            color: #4B5563;
            margin-bottom: 6px;
            margin-top: 15px;
        }

        /* Password Field Wrapper for Eye Icon */
        .password-wrapper {
            position: relative;
            width: 100%;
        }
        .password-wrapper input {
            width: 100%;
            padding-right: 45px; /* Make space for the eye icon */
        }
        .eye-btn {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #9CA3AF;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }
        .eye-btn:hover {
            color: #3A86FF;
        }
        .eye-btn svg {
            width: 18px;
            height: 18px;
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- STEP 1: REQUEST EMAIL -->
    <div id="step1" class="step-container active">
        <form id="requestForm">
            <div class="icon-circle"><i data-feather="key" style="width:40px; height:40px;"></i></div>
            <h1 style="color: #333; margin-bottom: 10px;">Forgot Password?</h1>
            <p style="text-align:center; color:#666;">Enter your registered email address and we'll send you a reset token.</p>
            
            <div id="alert1" style="color:red; font-size:0.9rem; display:none; margin-bottom:10px;"></div>

            <label class="input-label">Email Address</label>
            <input type="email" id="emailInput" placeholder="Enter your email" required />
            
            <button type="submit" style="background-color: #3A86FF; width:100%; margin-top: 20px;">Send Reset Code</button>
            <a href="login.html" style="margin-top:20px; display:block;">Back to Login</a>
        </form>
    </div>

    <!-- STEP 2: ENTER NEW PASSWORD -->
    <div id="step2" class="step-container">
        <form id="resetForm">
            <div class="icon-circle" style="background:#ecfdf5; color:#10B981;"><i data-feather="lock" style="width:40px; height:40px;"></i></div>
            <h1 style="color: #333; margin-bottom: 10px;">Reset Password</h1>
            <p style="text-align:center; color:#666;">Create a new secure password.</p>

            <div id="alert2" style="color:red; font-size:0.9rem; display:none; margin-bottom:10px;"></div>

            <!-- Token Field -->
            <label class="input-label">Reset Token</label>
            <input type="text" id="tokenInput" placeholder="Paste Reset Token Here" required style="border:1px dashed #3A86FF; background:#f0f9ff; color: #3A86FF; font-weight: bold;" />
            
            <!-- New Password Field -->
            <label class="input-label">New Password</label>
            <div class="password-wrapper">
                <input type="password" id="newPass" placeholder="Enter new password" required autocomplete="new-password" />
                <span class="eye-btn" onclick="togglePassword('newPass', this)">
                    <i data-feather="eye"></i>
                </span>
            </div>
            
            <!-- Confirm Password Field -->
            <label class="input-label">Retype Password</label>
            <div class="password-wrapper">
                <input type="password" id="confirmPass" placeholder="Confirm new password" required autocomplete="new-password" />
                <span class="eye-btn" onclick="togglePassword('confirmPass', this)">
                    <i data-feather="eye"></i>
                </span>
            </div>
            
            <button type="submit" style="background-color: #10B981; border-color:#10B981; width:100%; margin-top: 20px;">Update Password</button>
        </form>
    </div>

</div>

<script>
    feather.replace();
    const API_BASE_URL = "http://127.0.0.1:8000";

    // Toggle Password Visibility
    function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);
        // Toggle Type
        if (input.type === "password") {
            input.type = "text";
            btn.style.color = "#3A86FF"; // Active color
        } else {
            input.type = "password";
            btn.style.color = "#9CA3AF"; // Default color
        }
    }

    // Step 1: Send Email
    document.getElementById('requestForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        const alertBox = document.getElementById('alert1');
        const email = document.getElementById('emailInput').value;

        btn.innerText = "Sending..."; btn.disabled = true;
        alertBox.style.display = 'none';

        try {
            const res = await fetch(`${API_BASE_URL}/auth/forgot-password`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email: email })
            });
            const data = await res.json();

            if(res.ok) {
                // Switch to Step 2
                document.getElementById('step1').classList.remove('active');
                document.getElementById('step2').classList.add('active');
                
                // --- AUTO FILL TOKEN ONLY ---
                if(data.debug_token) {
                    document.getElementById('tokenInput').value = data.debug_token;
                }
                // Ensure passwords are empty
                document.getElementById('newPass').value = "";
                document.getElementById('confirmPass').value = "";

                alert("Code sent! Check your backend terminal.");
            } else {
                throw new Error(data.detail || "Request failed");
            }
        } catch(err) {
            alertBox.innerText = err.message;
            alertBox.style.display = 'block';
            btn.innerText = "Send Reset Code"; btn.disabled = false;
        }
    });

    // Step 2: Reset Password
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        const alertBox = document.getElementById('alert2');
        
        const token = document.getElementById('tokenInput').value;
        const newPass = document.getElementById('newPass').value;
        const confirmPass = document.getElementById('confirmPass').value;

        if(newPass !== confirmPass) {
            alertBox.innerText = "Passwords do not match";
            alertBox.style.display = 'block';
            return;
        }

        btn.innerText = "Updating..."; btn.disabled = true;

        try {
            const res = await fetch(`${API_BASE_URL}/auth/reset-password`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ token: token, new_password: newPass })
            });
            const data = await res.json();

            if(res.ok) {
                alert("Success! Password changed. Please login.");
                window.location.href = "login.html";
            } else {
                throw new Error(data.detail || "Reset failed");
            }
        } catch(err) {
            alertBox.innerText = err.message;
            alertBox.style.display = 'block';
            btn.innerText = "Update Password"; btn.disabled = false;
        }
    });
</script>

</body>
</html>
